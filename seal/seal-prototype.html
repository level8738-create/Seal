      <div class="row">
        <div>
          <h4>Payment status</h4>
          <p>${p.paymentStatus==='paid' ? 'Marked paid — the original file link is visible to your client.' : 'Confirm payment has been received before unlocking the original file.'}</p>
        </div>
        ${p.paymentStatus==='paid'
          ? `<span class="status-chip paid">Unlocked ✓</span>`
          : `<button class="btn btn-primary btn-sm" onclick="confirmMarkPaid('${id}')">Mark as Paid</button>`}
      </div>
      ${p.paymentStatus==='paid' ? `
      <div style="margin-top:14px;padding-top:14px;border-top:1px solid var(--border);">
        <div class="lbl" style="font-size:11px;color:var(--ink-faint);text-transform:uppercase;letter-spacing:.05em;font-weight:700;margin-bottom:6px;">Original file (owner access)</div>
        <a href="${escapeAttr(p.originalLink)}" target="_blank" style="color:var(--green);font-family:var(--font-mono);font-size:12.5px;word-break:break-all;">${escapeHtml(p.originalLink)}</a>
        <div class="expiry-warning">⚠️ <span>Client link expires ${fmtDateTime(p.paidAt + LINK_TTL_MS)} (24hrs after payment). This project auto-deletes ${fmtDateTime(p.paidAt + PROJECT_TTL_MS)} (48hrs after payment).</span></div>
      </div>` : ''}
    </div>

    <div class="section-title">🎞 Media (${media.length})</div>
    ${media.length===0 ? `<div class="empty-state"><p>No media in this project yet.</p></div>` : `
    <div class="media-grid">
      ${media.map(m=>mediaCard(m,p.watermarkText,id)).join('')}
    </div>`}

    <div class="demo-note">Owner tools: rename, watermark reconfiguration, and re-upload would live in Project Settings (kept out of this prototype for scope, but modeled in the architecture doc).</div>
  `;
}

function mediaCard(m, wmText, projId){
  // Video previews are now persistent server-hosted URLs (see
  // uploadVideo()), so there's no "session expired" state anymore —
  // only the same previewUnavailable case images can hit.
  let badgeText = 'Protected';
  if(m.previewUnavailable) badgeText = 'Re-upload needed';

  let hintText = '👁 Click to view';
  if(m.previewUnavailable) hintText = 'Preview unavailable';

  return `
  <div class="media-card" oncontextmenu="return false;" onclick="openMediaLightbox('${projId}','${m.id}')">
    <div class="media-preview-wrap file-mode">
      <div class="file-icon">${m.previewUnavailable ? '⚠️' : (m.kind==='video'?'🎬':'🖼')}</div>
      <div class="view-hint">${hintText}</div>
      <div class="no-rightclick-badge">${badgeText}</div>
    </div>
    <div class="media-meta">
      <div class="mname">${escapeHtml(m.name)}</div>
      <div class="mtype">${m.kind==='video'?'Video':'Photo'} · ${fmtSize(m.size)}</div>
    </div>
  </div>`;
}

function showLightboxError(mediaWrap, msg){
  mediaWrap.innerHTML = `<div class="lightbox-error">⚠️ ${escapeHtml(msg)}</div>`;
}

/* Opens the actual video/photo full-size, with the watermark applied,
   only when the user explicitly clicks the file — the grid itself
   never shows raw media. Built with DOM APIs (not one big innerHTML
   string) so large video data isn't re-parsed as HTML, and so we can
   attach load/error/play handlers instead of failing silently. */
function openMediaLightbox(projId, mediaId){
  const p = state.projects.find(x=>x.id===projId);
  const media = mediaStore[projId] || [];
  const m = media.find(x=>x.id===mediaId);
  if(!p || !m) return;

  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop lightbox-backdrop';
  backdrop.onclick = (ev)=>{ if(ev.target===backdrop) backdrop.remove(); };

  const box = document.createElement('div');
  box.className = 'lightbox';
  box.oncontextmenu = ()=>false;

  const backBtn = document.createElement('button');
  backBtn.className = 'lightbox-back';
  backBtn.innerHTML = '← <span>Back</span>';
  backBtn.onclick = ()=> backdrop.remove();
  box.appendChild(backBtn);

  const closeBtn = document.createElement('button');
  closeBtn.className = 'lightbox-close';
  closeBtn.textContent = '✕';
  closeBtn.onclick = ()=> backdrop.remove();
  box.appendChild(closeBtn);

  const mediaWrap = document.createElement('div');
  mediaWrap.className = 'lightbox-media-wrap';
  box.appendChild(mediaWrap);

  const caption = document.createElement('div');
  caption.className = 'lightbox-caption';
  caption.textContent = `${m.name} · ${m.kind==='video'?'Video':'Photo'} · ${fmtSize(m.size)}`;
  box.appendChild(caption);

  backdrop.appendChild(box);
  document.body.appendChild(backdrop);

  if(m.previewUnavailable){
    showLightboxError(mediaWrap, `This file's preview wasn't kept — it was too large to save for a demo reload (browser storage cap). It's still listed here; re-upload it in a new project to preview it again. Your original file link is unaffected.`);
    return;
  }

  if(m.kind === 'image'){
    if(!m.previewUrl){
      showLightboxError(mediaWrap, `No preview is available for this image.`);
      return;
    }
    const img = document.createElement('img');
    img.alt = m.name;
    img.onerror = ()=> showLightboxError(mediaWrap, "This image couldn't be loaded.");
    img.src = m.previewUrl;
    mediaWrap.appendChild(img);

    // Moving watermark overlay — NOT burned into the image pixels, just
    // layered visually on top, same treatment as video below.
    const imgOverlay = document.createElement('div');
    imgOverlay.className = 'wm-overlay';
    imgOverlay.innerHTML = `<div class="wm-center">${escapeHtml(buildWatermarkText(p.watermarkText, p.name))}</div>`;
    mediaWrap.appendChild(imgOverlay);
    return;
  }

  // video
  if(!m.previewUrl){
    showLightboxError(mediaWrap, `No preview is available for this video. Re-upload it in a new project to process it again. Your original file link is unaffected.`);
    return;
  }
  // No canPlayType() gate needed anymore: the preview is always a
  // server-transcoded H.264/AAC MP4, regardless of what codec the
  // original upload used (H.265/HEVC, VP9, etc.) — every browser that
  // can play <video> at all can play this.

  const video = document.createElement('video');
  video.muted = true;
  video.loop = true;
  video.playsInline = true;
  video.controls = true;
  video.setAttribute('controlsList', 'nodownload noremoteplayback');
  video.oncontextmenu = ()=>false;
  mediaWrap.appendChild(video);

  const overlay = document.createElement('div');
  overlay.className = 'wm-overlay';
  overlay.innerHTML = `<div class="wm-center">${escapeHtml(buildWatermarkText(p.watermarkText, p.name))}</div>`;
  mediaWrap.appendChild(overlay);

  const loading = document.createElement('div');
  loading.className = 'lightbox-loading';
  loading.textContent = 'Loading preview…';
  mediaWrap.appendChild(loading);

  video.onloadeddata = ()=>{ loading.remove(); };
  video.onerror = ()=>{
    // Rare now: the preview is always a server-transcoded H.264/AAC MP4,
    // so a playback error here almost always means the network request
    // for the preview itself failed (server down, preview file missing),
    // not a codec problem.
    console.error('Video preview failed:', m.name, video.error);
    loading.remove();
    video.remove();
    overlay.remove();
    showLightboxError(mediaWrap, `This video preview couldn't be loaded. Check that the processing server is reachable, or re-upload the file in a new project.`);
  };

  video.src = m.previewUrl;
  const playPromise = video.play();
  if(playPromise && playPromise.catch){
    // Autoplay can be blocked by the browser; that's fine — controls
    // are still clickable now, so the user can just press play.
    playPromise.catch(()=>{ loading.remove(); });
  }
}

async function copyLink(url){
  // Primary path: async Clipboard API (needs a secure context + permission).
  try{
    if(navigator.clipboard && window.isSecureContext){
      await navigator.clipboard.writeText(url);
      toast('Client link copied.', 'ok');
      return;
    }
    throw new Error('clipboard-api-unavailable');
  }catch(err){
    // Fallback: hidden textarea + execCommand, works in sandboxed/insecure contexts.
    try{
      const ta = document.createElement('textarea');
      ta.value = url;
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.focus();
      ta.select();
      ta.setSelectionRange(0, url.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      if(ok){ toast('Client link copied.', 'ok'); }
      else { toast('Could not copy automatically — select and copy the link manually.', 'danger'); }
    }catch(err2){
      toast('Could not copy automatically — select and copy the link manually.', 'danger');
    }
  }
}

function confirmMarkPaid(id){
  const backdrop = document.createElement('div');
  backdrop.className = 'modal-backdrop';
  backdrop.innerHTML = `
    <div class="modal">
      <h3>Mark this project as paid?</h3>
      <p>Once this project is marked as paid, the original file link provided for this project will become available to the client. Make sure payment has been successfully received before continuing.</p>
      <div class="actions">
        <button class="btn btn-ghost" onclick="this.closest('.modal-backdrop').remove()">Cancel</button>
        <button class="btn btn-primary" onclick="doMarkPaid('${id}')">Mark as Paid</button>
      </div>
    </div>`;
  document.body.appendChild(backdrop);
}
async function doMarkPaid(id){
  const p = state.projects.find(x=>x.id===id);
  p.paymentStatus = 'paid';
  p.paidAt = Date.now();
  await saveProjects();
  document.querySelector('.modal-backdrop')?.remove();
  toast('Project marked as paid.', 'ok');
  toast('Original files unlocked.', 'ok');
  render();
}

/* ================= PROJECT — CLIENT VIEW ================= */
function renderClientView(app, id){
  const p = state.projects.find(x=>x.id===id);
  if(!p){ app.innerHTML = notFoundBlock(); return; }
  if(isLinkExpired(p)){ app.innerHTML = expiredLinkBlock(); return; }
  if(mediaStore[id] === undefined){
    app.innerHTML = loadingBlock();
    ensureMediaLoaded(id);
    return;
  }
  const media = mediaStore[id] || [];
  const paid = p.paymentStatus === 'paid';

  app.innerHTML = `
    <div style="max-width:900px;margin:0 auto;">
      <div class="topbar" style="margin-bottom:8px;">
        <div class="brand"><div class="mark">🔒</div> Seal</div>
        <button class="btn btn-ghost btn-sm" onclick="go('#/project/${id}')">← Back to owner view</button>
      </div>
      <div class="role-banner client">You're viewing the client-facing page for this link — no account required.</div>

      <h1 style="font-family:var(--font-display);font-size:24px;margin-bottom:22px;">${escapeHtml(p.name)}</h1>

      <div class="unlock-hero ${paid?'paid':'pending'}">
        <div class="lockicon">${paid?'🔓':'🔒'}</div>
        <h2>${paid?'PAYMENT COMPLETE':'PAY TO UNLOCK'}</h2>
        <p>${paid
          ? 'Payment has been confirmed. Your original, full-resolution files are available below.'
          : 'Complete your payment with the freelancer to receive access to the original, unwatermarked files.'}</p>
        ${paid ? `
          <div class="original-link-box">
            <span>📂</span>
            <a href="${escapeAttr(p.originalLink)}" target="_blank">${escapeHtml(p.originalLink)}</a>
          </div>
        ` : `
          <button class="btn btn-primary" onclick="toast('This is a UI mock — payment is confirmed by the freelancer once received.')">Complete Payment</button>
        `}
      </div>

      <div class="section-title">Preview (${media.length} file${media.length!==1?'s':''})</div>
      ${media.length===0 ? `<div class="empty-state"><p>No preview media available in this session.</p></div>` : `
      <div class="media-grid">
        ${media.map(m=>mediaCard(m,p.watermarkText,id)).join('')}
      </div>`}

      <div class="demo-note">Downloads, right-click save, and dev-tools inspection are not true security boundaries — they only discourage casual copying. The real protection is server-side: this prototype never gives the client route access to <code>originalLink</code> until <code>paymentStatus === 'paid'</code>, and a production backend would enforce that same check on every API response, not just in the UI.</div>
    </div>
  `;
}

function notFoundBlock(){
  return `<div class="empty-state" style="margin-top:40px;"><div class="big">🚫</div><h3>Project not found</h3><p>This link may be invalid, or the project was deleted.</p><div style="margin-top:16px;"><button class="btn btn-ghost" onclick="go('#/dashboard')">Go to dashboard</button></div></div>`;
}
function expiredLinkBlock(){
  return `<div class="empty-state" style="margin-top:40px;"><div class="big">⏳</div><h3>This link has expired</h3><p>For security, client links stop working 24 hours after payment is confirmed. Please contact the freelancer if you still need access.</p></div>`;
}

function escapeHtml(str){
  return String(str).replace(/[&<>"']/g, s=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[s]));
}
function escapeAttr(str){ return escapeHtml(str); }

/* ---------------- INIT ---------------- */
(async function init(){
  await loadState();
  await purgeExpiredProjects();
  render();
  // Re-check every minute in case a project crosses its 48hr deletion
  // mark while the app stays open in the tab.
  setInterval(async ()=>{
    const changed = await purgeExpiredProjects();
    if(changed) render();
  }, 60000);
})();
</script>
